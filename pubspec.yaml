name: conge_calculateur
description: A specialized vacation planning tool for Moroccan customs officers that automatically calculates vacation days, excludes weekends and public holidays, tracks annual leave balance, and provides work schedule planning features. Available in Arabic, French, and English.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  url_launcher: ^6.2.2
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png

